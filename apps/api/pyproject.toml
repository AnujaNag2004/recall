[project]
name = "recall-api"
version = "0.1.0"
description = "Recall backend: REST + SSE API and the agent system."
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "langgraph>=1.2.20",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    "pypdf>=7.0.0",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.0.36",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.32",
    "youtube-transcript-api>=1.2.5",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pgserver>=0.1.4",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are designed to be used as argument defaults.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["app", "tests"]

[project]
name = "recall-mcp"
version = "0.1.0"
description = "MCP server exposing your Recall saves and tasks."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "mcp>=2,<3"]

[project.scripts]
recall-mcp = "recall_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recall_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

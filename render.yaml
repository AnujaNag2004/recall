# Render blueprint for the API. Secrets use sync: false, so you enter them in the
# dashboard and they never live in the repo.
services:
  - type: web
    name: recall-api
    runtime: docker
    plan: free
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_FAST_MODEL
        sync: false
      - key: GEMINI_STRONG_MODEL
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_FAST_MODEL
        sync: false
      - key: GROQ_STRONG_MODEL
        sync: false
      - key: GROQ_WHISPER_MODEL
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
